# Primary install path: app + worker + PostgreSQL.
# Usage: node scripts/gen-secrets.mjs --write (creates .env), set PUBLIC_URL, then
#   docker compose up -d --build
services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-finance}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # No published port: the database only accepts connections from this compose network.

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-finance}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-finance}
      DATA_DIR: /data
      HOSTNAME: 0.0.0.0
      RUN_MIGRATIONS: "1"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app-data:/data
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3070}:3070"

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-finance}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-finance}
      DATA_DIR: /data
    command: ["sh", "scripts/start-worker.sh"]
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    volumes:
      - app-data:/data

volumes:
  db-data:
  app-data:
